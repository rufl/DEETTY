name: Bug report
description: Report a reproducible DEETTY or NoctEd bug
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DEETTY. Please keep reports reproducible and proof-bounded.
        Do not include secrets, credentials, private terminal output, or security issues here; see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands/clicks/keys needed to reproduce.
      placeholder: |
        1. Run ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - DEETTY terminal/workspace
        - NoctEd editor
        - packaging/install
        - docs
        - unknown
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Desktop/session
      placeholder: Plasma Wayland, Plasma X11, Niri, etc.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Arch, Fedora, Debian, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DEETTY commit/version
      placeholder: git commit or version output, if known
  - type: textarea
    id: logs
    attributes:
      label: Logs/screenshots
      description: Paste only non-sensitive logs or attach screenshots.
