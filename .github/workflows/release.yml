name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev libvte-2.91-dev libgtksourceview-4-dev libgtk-layer-shell0 desktop-file-utils libxml2-utils rpm
      - name: Assert runner architecture
        run: |
          actual_arch="$(uname -m)"
          case "${{ matrix.arch }}:$actual_arch" in
            x86_64:x86_64|aarch64:aarch64) ;;
            *)
              echo "matrix arch ${{ matrix.arch }} does not match runner arch $actual_arch" >&2
              exit 1
              ;;
          esac
      - run: ./scripts/verify.sh
      - run: ./scripts/package_manifests_smoke.sh
      - run: ./scripts/package_bundle.sh "noctty-linux-${{ matrix.arch }}.tar.gz"
      - name: Validate release archive
        run: |
          archive="noctty-linux-${{ matrix.arch }}.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$archive.manifest"
          sha256sum -c "$archive.sha256"
          grep -F 'bundle_manifest_version=1' "$archive.manifest" >/dev/null
          grep -F 'archive_sha256=' "$archive.manifest" >/dev/null
          grep -F 'library_inventory_begin' "$archive.manifest" >/dev/null
          grep -F 'package_inventory_begin' "$archive.manifest" >/dev/null
          grep -F 'license_files_begin' "$archive.manifest" >/dev/null
          grep -F 'redistribution_ready=true' "$archive.manifest" >/dev/null
          grep -F 'all_copied_host_libraries_accounted=true' "$archive.manifest" >/dev/null
          grep -F 'bundle_license_payload_complete=true' "$archive.manifest" >/dev/null
          tar -tzf "$archive" | grep -F './bin/noctty' >/dev/null
          tar -tzf "$archive" | grep -F './bin/nocted' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/noctty/noctty' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/noctty/nocted' >/dev/null
          tar -tzf "$archive" | grep -F './share/nocted/language-specs/zig.lang' >/dev/null
          tar -tzf "$archive" | grep -F './share/nocted/language-specs/svelte.lang' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/noctty/lib/libgtk-layer-shell.so.0' >/dev/null
          tar -tzf "$archive" | grep -F './share/licenses/noctty/dependencies/packages/' >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: noctty-linux-${{ matrix.arch }}
          path: |
            noctty-linux-${{ matrix.arch }}.tar.gz
            noctty-linux-${{ matrix.arch }}.tar.gz.sha256
            noctty-linux-${{ matrix.arch }}.tar.gz.manifest
