name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Install Linux build and isolated-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap dbus-x11 xvfb xauth openbox kwin-wayland \
            libgtk-3-dev libepoxy-dev libvte-2.91-dev libgtksourceview-4-dev \
            libgtk-layer-shell0 libgtk-layer-shell-dev \
            desktop-file-utils libxml2-utils rpm
      - name: Assert runner architecture
        run: |
          actual_arch="$(uname -m)"
          case "${{ matrix.arch }}:$actual_arch" in
            x86_64:x86_64|aarch64:aarch64) ;;
            *)
              echo "matrix arch ${{ matrix.arch }} does not match runner arch $actual_arch" >&2
              exit 1
              ;;
          esac
      - name: Verify bounded source alpha
        env:
          OVERZEER_DISPLAY_RUNNER: ${{ github.workspace }}/scripts/isolated_display_runner.sh
        run: ./scripts/public_alpha_verify.sh
      - run: ./scripts/package_manifests_smoke.sh
      - run: ./scripts/package_bundle.sh "deetty-linux-${{ matrix.arch }}.tar.gz"
      - name: Validate release archive
        run: |
          archive="deetty-linux-${{ matrix.arch }}.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$archive.manifest"
          sha256sum -c "$archive.sha256"
          grep -F 'bundle_manifest_version=1' "$archive.manifest" >/dev/null
          grep -F 'archive_sha256=' "$archive.manifest" >/dev/null
          grep -F 'library_inventory_begin' "$archive.manifest" >/dev/null
          grep -F 'package_inventory_begin' "$archive.manifest" >/dev/null
          grep -F 'license_files_begin' "$archive.manifest" >/dev/null
          grep -F 'redistribution_ready=true' "$archive.manifest" >/dev/null
          grep -F 'all_copied_host_libraries_accounted=true' "$archive.manifest" >/dev/null
          grep -F 'bundle_license_payload_complete=true' "$archive.manifest" >/dev/null
          grep -F 'gtk_layer_shell_source=system' "$archive.manifest" >/dev/null
          tar -tzf "$archive" | grep -F './bin/deetty' >/dev/null
          tar -tzf "$archive" | grep -F './bin/nocted' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/deetty/deetty' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/deetty/nocted' >/dev/null
          tar -tzf "$archive" | grep -F './share/nocted/language-specs/zig.lang' >/dev/null
          tar -tzf "$archive" | grep -F './share/nocted/language-specs/svelte.lang' >/dev/null
          tar -tzf "$archive" | grep -F './libexec/deetty/lib/libgtk-layer-shell.so.0' >/dev/null
          tar -tzf "$archive" | grep -F './share/licenses/deetty/dependencies/packages/' >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deetty-linux-${{ matrix.arch }}
          path: |
            deetty-linux-${{ matrix.arch }}.tar.gz
            deetty-linux-${{ matrix.arch }}.tar.gz.sha256
            deetty-linux-${{ matrix.arch }}.tar.gz.manifest

  windows:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Compile Windows host
        run: zig build check -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe -j1 --summary all
      - name: Package Windows alpha
        run: ./scripts/package_windows.sh deetty-windows-x86_64-alpha.zip
      - name: Validate Windows archive
        run: |
          sha256sum -c deetty-windows-x86_64-alpha.zip.sha256
          grep -F 'win32_native=true' deetty-windows-x86_64-alpha.zip.manifest >/dev/null
          grep -F 'conpty=true' deetty-windows-x86_64-alpha.zip.manifest >/dev/null
          grep -F 'gtk_runtime=false' deetty-windows-x86_64-alpha.zip.manifest >/dev/null
          grep -F 'physical_windows_validation=false' deetty-windows-x86_64-alpha.zip.manifest >/dev/null
          unzip -l deetty-windows-x86_64-alpha.zip | grep -F 'deetty-windows-x86_64/deetty.exe' >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deetty-windows-x86_64-alpha
          path: |
            deetty-windows-x86_64-alpha.zip
            deetty-windows-x86_64-alpha.zip.sha256
            deetty-windows-x86_64-alpha.zip.manifest

  windows-runtime:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Build on Windows
        shell: pwsh
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe -j1 --prefix windows-smoke
      - name: Run native ConPTY/VT/GDI smoke
        shell: pwsh
        run: |
          Copy-Item scripts/windows_smoke.ps1 windows-smoke/bin/WINDOWS-SMOKE.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows-smoke/bin/WINDOWS-SMOKE.ps1 -AutomatedHost
